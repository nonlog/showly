name: Fork CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      generate_baseline_profile:
        description: Generate and upload a fork Baseline Profile
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.generate_baseline_profile && 'profile' || 'ci' }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch' || !inputs.generate_baseline_profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run ktlint
        shell: bash
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod a+x ktlint
          set +e
          ./ktlint 2>&1 | tee ktlint.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### ktlint failure"
              echo '~~~~text'
              tail -n 240 ktlint.log
              echo '~~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  test-build:
    if: github.event_name != 'workflow_dispatch' || !inputs.generate_baseline_profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare fork-safe debug configuration
        shell: bash
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          SHOWLY_FORK_RELEASE_KEYSTORE_B64: ${{ secrets.SHOWLY_FORK_RELEASE_KEYSTORE_B64 }}
          SHOWLY_FORK_RELEASE_STORE_PASSWORD: ${{ secrets.SHOWLY_FORK_RELEASE_STORE_PASSWORD }}
          SHOWLY_FORK_RELEASE_KEY_ALIAS: ${{ secrets.SHOWLY_FORK_RELEASE_KEY_ALIAS }}
          SHOWLY_FORK_RELEASE_KEY_PASSWORD: ${{ secrets.SHOWLY_FORK_RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          trakt_client_id="${TRAKT_CLIENT_ID:-ci-placeholder}"
          trakt_client_secret="${TRAKT_CLIENT_SECRET:-ci-placeholder}"
          tmdb_read_access_token="${TMDB_READ_ACCESS_TOKEN:-ci-placeholder}"
          if [[ -n "$TRAKT_CLIENT_ID" && -n "$TRAKT_CLIENT_SECRET" ]]; then
            echo "Using fork-owned Trakt OAuth credentials."
          else
            echo "Using non-functional Trakt placeholders for this CI context."
          fi
          if [[ -n "$TMDB_READ_ACCESS_TOKEN" ]]; then
            echo "Using fork-owned TMDB Read Access Token."
          else
            echo "::warning::TMDB_READ_ACCESS_TOKEN is unavailable; posters and TMDB metadata will not load in this APK."
          fi
          cat > local.properties <<EOF
          traktClientId="${trakt_client_id}"
          traktClientSecret="${trakt_client_secret}"
          tmdbApiKey="${tmdb_read_access_token}"
          omdbApiKey="ci-placeholder"
          EOF
          if [[ -n "${SHOWLY_FORK_RELEASE_KEYSTORE_B64:-}" && -n "${SHOWLY_FORK_RELEASE_STORE_PASSWORD:-}" && -n "${SHOWLY_FORK_RELEASE_KEY_ALIAS:-}" && -n "${SHOWLY_FORK_RELEASE_KEY_PASSWORD:-}" ]]; then
            printf '%s' "$SHOWLY_FORK_RELEASE_KEYSTORE_B64" | base64 --decode > app/keystore
            cat > app/keystore.properties <<EOF
          storePassword=$SHOWLY_FORK_RELEASE_STORE_PASSWORD
          keyPassword=$SHOWLY_FORK_RELEASE_KEY_PASSWORD
          keyAlias=$SHOWLY_FORK_RELEASE_KEY_ALIAS
          EOF
            echo "Persistent fork Release signing enabled."
          else
            cat > app/keystore.properties <<'EOF'
          storePassword=ci-placeholder
          keyPassword=ci-placeholder
          keyAlias=ci-placeholder
          EOF
            : > app/keystore
            echo "Persistent fork Release signing unavailable in this CI context."
          fi

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace             :app:testDebugUnitTest             :data-local:testDebugUnitTest             :data-remote:testDebugUnitTest             :repository:testDebugUnitTest             :ui-discover:testDebugUnitTest             :ui-trakt-sync:testDebugUnitTest             :ui-statistics:testDebugUnitTest             :ui-statistics-movies:testDebugUnitTest             :ui-search:testDebugUnitTest             :ui-progress-movies:testDebugUnitTest 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Unit test failure"
              echo '~~~~text'
              tail -n 300 unit-tests.log
              echo '~~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload unit test failure log
        if: failure() && hashFiles('unit-tests.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: showly-unit-test-failure-${{ github.sha }}
          path: unit-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: showly-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build fork Release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon --stacktrace :app:assembleForkRelease

      - name: Upload fork Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: showly-release-${{ github.sha }}
          path: app/build/outputs/apk/forkRelease/*.apk
          if-no-files-found: error
          retention-days: 14

  baseline-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.generate_baseline_profile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm

      - name: Prepare Baseline Profile build
        shell: bash
        env:
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          umask 077
          cat > local.properties <<EOF
          traktClientId="${TRAKT_CLIENT_ID:-ci-placeholder}"
          traktClientSecret="${TRAKT_CLIENT_SECRET:-ci-placeholder}"
          tmdbApiKey="${TMDB_READ_ACCESS_TOKEN:-ci-placeholder}"
          omdbApiKey="ci-placeholder"
          EOF
          keytool -genkeypair -v \
            -keystore app/keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Showly Baseline Profile,OU=CI,O=nonlog,L=CI,S=CI,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > app/keystore.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          EOF

      - name: Generate Baseline Profile
        run: >-
          ./gradlew --no-daemon --stacktrace :app:generateBaselineProfile
          -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile

      - name: Verify generated profile
        shell: bash
        run: |
          profile_dir="app/src/main/generated/baselineProfiles"
          profile="$profile_dir/baseline-prof.txt"
          test -s "$profile"
          echo "Generated $(wc -l < "$profile") baseline profile rules."
          find "$profile_dir" -maxdepth 1 -type f -name '*.txt' -print

      - name: Upload generated profile
        uses: actions/upload-artifact@v7
        with:
          name: showly-baseline-profile-${{ github.sha }}
          path: app/src/main/generated/baselineProfiles/*.txt
          if-no-files-found: error
          retention-days: 14
